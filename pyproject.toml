[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-usage-monitor"
dynamic = ["version"]
description = "CLI usage monitor for Claude, Gemini, and OpenRouter plan/session limits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.7",
]

[project.scripts]
ai-usage-monitor = "ai_usage_monitor.cli:main"

[tool.hatch.version]
path = "src/ai_usage_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_usage_monitor"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
